{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>

    <h2>로그인</h2>

    <!-- 에러 메시지 출력 부분 (아이디/비밀번호 오류 시) -->
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <!-- 로그인 폼 -->
    <form method="POST" action="">
        <!-- Django 보안 토큰 -->
        {% csrf_token %}

        <div>
            <label for="username">아이디:</label>
            <input type="text" id="username" name="username" required>
        </div>

        <br>

        <div>
            <label for="password">비밀번호:</label>
            <input type="password" id="password" name="password" required>
        </div>

        <br>

        <div>
            <input type="checkbox" id="remember_session" name="remember_session" value="true">
            <label for="remember_session">로그인 상태 유지</label>
        </div>

        <br>

        <button type="submit">로그인</button>
    </form>
    <button type="button"><a href="/user/signup/">회원가입</a></button>

</body>
</html>
