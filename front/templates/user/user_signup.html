{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <!-- 파비콘 변경 -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/modi-icon.svg' %}">

    <!-- app.css 연결 -->
    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    <!-- header, footer CSS 연결 -->
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
</head>
<body>

    <div>
    <!-- 뒤로가기 (로그인 페이지) -->
    <a href="/user/login">로그인</a>

    <h1>사용자 등록</h1>

    <div>
        {% csrf_token %}

        <div>
            <label for="inputUsername">아이디</label>
            <input id="inputUsername" type="text" name="username" placeholder="아이디" autocomplete="off">
        </div>

        <div>
            <label for="inputName">이름</label>
            <input id="inputName" type="text" name="name" placeholder="이름" autocomplete="off">
        </div>

        <div>
            <label for="inputEmail">이메일</label>
            <input id="inputEmail" type="text" name="email" placeholder="crms@kdance.or.kr" autocomplete="off">
        </div>

        <div>
            <label for="inputPassword">비밀번호</label>
            <input id="inputPassword" type="password" name="password" placeholder="••••••••">
        </div>

        <div>
            <label for="confirmPassword">비밀번호 확인</label>
            <input id="confirmPassword" type="password" name="confirm_password" placeholder="••••••••">
        </div>

        <!-- 에러 메시지 출력 -->
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    </div>

    <!-- 회원가입 버튼 -->
    <button type="button" onclick="signUp()">회원가입</button>
</div>


</body>
<script>
    /* 유횽성 검사 */
    function inputValid() {
        if (document.getElementById('inputUsername').value === "") {
            alert("아이디는 필수 입력값입니다.");
            document.getElementById('inputUsername').focus();
            return false;
        }
        if (document.getElementById('inputEmail').value === "") {
            alert("이메일은 필수 입력값입니다.");
            document.getElementById('inputEmail').focus();
            return false;
        }

        const pw = document.getElementById('inputPassword');
        const conPw = document.getElementById('confirmPassword');

        if (pw.value !== "" || conPw.value !== "") {

            if (pw.value === "") {
                alert("비밀번호를 입력해주세요.");
                pw.focus();
                return false;
            }

            if (conPw.value === "") {
                alert("비밀번호 확인을 입력해주세요.");
                conPw.focus();
                return false;
            }

            const pwRegex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()_+~`\-={}[\]:;"'<>,.?/]).{8,}$/;
            if (!pwRegex.test(pw.value)) {
                alert("비밀번호는 영문, 숫자, 특수문자 조합 8자 이상이어야 합니다.");
                pw.focus();
                return false;
            }

            if (pw.value !== conPw.value) {
                alert("비밀번호가 일치하지 않습니다.");
                conPw.focus();
                return false;
            }
        }
        return true;
    }

    async function signUp() {
        if (!inputValid()) {
            return;
        }

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
        if (!csrfToken) {
            return;
        }

        const formData = new FormData();
        formData.append('username', document.getElementById('inputUsername').value);
        formData.append('name', document.getElementById('inputName').value);
        formData.append('email', document.getElementById('inputEmail').value);
        formData.append('password', document.getElementById('inputPassword').value);
        formData.append('confirm_password', document.getElementById('confirmPassword').value);

        try {
            const response = await fetch('/user/signupAction/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken
                },
                body: formData
            });

            if (response.ok) {
                const data = await response.json();

                alert('회원가입이 완료되었습니다.');
                console.log('서버 응답:', data);
                window.location.href = '/user/login/';
            } else {
                const data = await response.json();
                alert(data.message || '회원가입에 실패했습니다. 상태 코드: ' + response.status);
            }
        } catch (error) {
            console.error('API 호출 중 에러 발생:', error);
            alert('서버와 통신 중 문제가 발생했습니다.');
        }

    }
</script>
</html>
