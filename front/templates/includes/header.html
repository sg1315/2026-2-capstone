{% load static %}

<header class="site-header">
    <div class="header-inner">
        <a href="{% url 'main' %}" class="header-logo" aria-label="Modi 홈">
            <img src="{% static 'images/modi-icon.svg' %}" alt="">
            <span>Modi</span>
            <span class="brand-beta">WORKSPACE</span>
        </a>

        <div class="header-manifesto">
            <span class="manifesto-dot"></span>
            회의에서 실행까지, 한 흐름으로
        </div>

        <div class="header-actions">

            {% if user.is_authenticated %}

                <!-- 로그인 상태 -->
                <span class="header-user">
                    {{ user.name|default:user.username }}님
                </span>

                <form method="POST" action="{% url 'user_logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="header-logout">
                        <span>로그아웃</span>
                        <svg class="logout-icon" viewBox="0 0 24 24" fill="none">
                            <path d="M10 17L15 12L10 7" />
                            <path d="M15 12H3" />
                            <path d="M14 3H19C20.1 3 21 3.9 21 5V19C21 20.1 20.1 21 19 21H14" />
                        </svg>
                    </button>
                </form>

            {% else %}

                <!-- 로그아웃 상태 -->
                <a class="header-login" href="{% url 'user_login' %}">
                    로그인
                </a>

                <a class="btn btn-primary header-signup" href="{% url 'user_signup' %}">
                    회원가입 <span aria-hidden="true">↗</span>
                </a>

            {% endif %}

        </div>
    </div>
</header>
